<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxel Sprite Cruncher</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LOCAL ART PIPELINE</p>
      <h1>Voxel Sprite Cruncher</h1>
    </div>
    <div class="top-actions">
      <span id="serverStatus" class="status-pill">本地服务已连接</span>
      <button id="scanButton" class="button secondary">扫描动作</button>
      <button id="previewButton" class="button secondary preview-button">单帧预览</button>
      <button id="buildButton" class="button primary">构建选中动画</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel asset-panel">
      <div class="panel-title">
        <span>角色与动作</span>
        <small id="actionCount">0 项</small>
      </div>

      <label class="field">
        <span>项目名称</span>
        <input id="projectName" type="text">
      </label>
      <label class="field">
        <span>源 GLB / FBX</span>
        <input id="sourcePath" type="text">
      </label>
      <label class="field compact">
        <span>输出标识</span>
        <input id="outputName" type="text">
      </label>

      <div class="section-label">动画动作</div>
      <div id="actionList" class="action-list">
        <div class="empty-state">点击“扫描动作”读取 Blender 动画</div>
      </div>

      <div class="section-label">材质区块</div>
      <p class="section-hint">勾选后按原纹理明度映射暗部、主色和高光；未勾选则保留 Blender 原纹理。</p>
      <div id="materialList" class="material-list">
        <div class="empty-state">扫描后显示材质区块</div>
      </div>
    </aside>

    <section class="panel preview-panel">
      <div class="panel-title">
        <span>动画预览</span>
        <div class="preview-toolbar">
          <div id="previewModes" class="preview-modes">
            <button class="mode-button" data-mode="color">Color</button>
            <button class="mode-button" data-mode="normal">Normal</button>
            <button class="mode-button" data-mode="material_id">Material ID</button>
            <button class="mode-button active" data-mode="composite">Composite</button>
          </div>
          <button id="playButton" class="icon-button" title="播放或暂停">▶</button>
          <span id="previewInfo">等待构建</span>
        </div>
      </div>

      <div class="preview-stage">
        <canvas id="previewCanvas" width="512" height="512"></canvas>
        <div class="axis horizontal"></div>
        <div class="axis vertical"></div>
      </div>

      <div id="artifactTabs" class="artifact-tabs"></div>
      <div class="sheet-strip">
        <img id="sheetImage" alt="SpriteSheet 预览">
      </div>
    </section>

    <aside class="panel settings-panel">
      <div class="panel-title">
        <span>渲染设置</span>
        <button id="saveButton" class="text-button">保存</button>
      </div>

      <div class="settings-grid">
        <label class="field compact">
          <span>画布尺寸</span>
          <input id="canvasSize" type="number" min="32" max="1024" step="16">
        </label>
        <label class="field compact">
          <span>默认 FPS</span>
          <input id="defaultFps" type="number" min="1" max="60" step="1">
        </label>
        <label class="field compact">
          <span>视角轴</span>
          <select id="viewAxis">
            <option value="+x">+X</option>
            <option value="-x">-X</option>
            <option value="+y">+Y</option>
            <option value="-y">-Y</option>
          </select>
        </label>
        <label class="field compact">
          <span>镜头留白</span>
          <input id="padding" type="number" min="1" max="3" step="0.01">
        </label>
        <label class="field compact">
          <span>图集列数</span>
          <input id="columns" type="number" min="1" max="32" step="1">
        </label>
      </div>

      <div class="section-label framing-title">当前动作构图 <span id="framingActionName">等待扫描</span></div>
      <div class="framing-card">
        <label class="field compact">
          <span>X 偏移（像素）</span>
          <input id="frameOffsetX" type="number" step="1" value="0">
        </label>
        <label class="field compact">
          <span>Y 偏移（像素）</span>
          <input id="frameOffsetY" type="number" step="1" value="0">
        </label>
        <label class="field compact framing-scale">
          <span>角色缩放</span>
          <input id="frameScale" type="number" min="0.1" max="5" step="0.05" value="1">
        </label>
      </div>

      <div class="composite-tip">Composite 模式下，在预览区移动鼠标可改变虚拟光源方向。光影只用于预览，不会烘焙进 Color 图。</div>

      <details class="advanced-settings">
        <summary>执行程序路径</summary>
        <label class="field">
          <span>Blender</span>
          <input id="blenderPath" type="text">
        </label>
        <label class="field">
          <span>Godot</span>
          <input id="godotPath" type="text">
        </label>
      </details>

      <div class="section-label">构建状态</div>
      <div class="job-card">
        <div>
          <strong id="jobStage">尚未构建</strong>
          <span id="jobState" class="job-state idle">IDLE</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <pre id="buildLog" class="build-log">等待任务…</pre>
    </aside>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
